<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LeafTriage - Disease Prediction</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
    min-height: 100vh;
}

header {
    background: #1b5e20;
    color: white;
    text-align: center;
    padding: 25px;
}

header h1 {
    margin: 0;
    font-size: 38px;
}

header p {
    margin: 8px 0 0;
}

.container {
    width: 650px;
    max-width: 94%;
    margin: 30px auto;
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.18);
}

h2 {
    text-align: center;
    color: #1b5e20;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
}

select,
input[type="file"] {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    border: 1px solid #aaa;
    border-radius: 8px;
    background: white;
}

#preview {
    display: none;
    width: 250px;
    height: 250px;
    object-fit: contain;
    margin: 20px auto;
    border: 2px solid #4caf50;
    border-radius: 12px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 25px;
    background: #2e7d32;
    color: white;
    border: none;
    border-radius: 9px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1b5e20;
}

#result {
    display: none;
    margin-top: 30px;
    padding: 22px;
    background: #f1f8e9;
    border-left: 6px solid #2e7d32;
    border-radius: 10px;
}

.result-row {
    padding: 10px 0;
    border-bottom: 1px solid #ddd;
}

.disease-name {
    color: #c62828;
    font-weight: bold;
}

.prediction-value {
    color: #1565c0;
    font-size: 20px;
    font-weight: bold;
}

.confidence {
    color: #2e7d32;
    font-size: 20px;
    font-weight: bold;
}

.confidence-container {
    width: 100%;
    height: 24px;
    margin-top: 12px;
    background: #ddd;
    border-radius: 15px;
    overflow: hidden;
}

#confidenceBar {
    width: 0%;
    height: 100%;
    background: #4caf50;
    transition: width 0.8s;
}

#statusOutput {
    font-weight: bold;
    font-size: 17px;
    margin-top: 15px;
}

.guidance {
    background: white;
    padding: 15px;
    border-radius: 8px;
}

.score-box {
    margin-top: 15px;
    background: white;
    padding: 15px;
    border-radius: 8px;
}

footer {
    text-align: center;
    padding: 20px;
    color: #555;
}
</style>
</head>

<h2 id="formTitle">🌱 Enter Leaf Details</h2>

<!-- SYMPTOM -->

<label id="symptomLabel">🔍 Spot / Symptom Type</label>

    <option value="none">No Visible Spots</option>

    <option value="brownspots">Brown Spots</option>
    <option value="blackspots">Black Spots</option>
    <option value="whitespots">White Spots</option>
    <option value="yellowspots">Yellow Spots</option>
    <option value="grayspots">Gray Spots</option>
    <option value="circular">Circular Spots</option>
    <option value="smallspots">Small Scattered Spots</option>
    <option value="largespots">Large Irregular Spots</option>
    <option value="longlesions">Long Brown Lesions</option>
    <option value="rectangular">Rectangular Lesions</option>
    <option value="watersoaked">Water-Soaked Spots</option>
    <option value="yellowhalo">Spots With Yellow Halo</option>
    <option value="powder">White Powdery Layer</option>
    <option value="mildew">Mildew / Fungal Growth</option>
    <option value="mosaic">Mosaic / Patchy Pattern</option>
    <option value="yellowing">General Leaf Yellowing</option>
    <option value="wilting">Wilting / Drooping</option>
    <option value="curling">Leaf Curling</option>
    <option value="dryedges">Dry / Brown Leaf Edges</option>
    <option value="holes">Holes / Damaged Areas</option>
    <option value="blight">Blighted / Dead Areas</option>
    <option value="streaks">Streaks / Stripes</option>
    <option value="vein">Vein Discoloration</option>
    <option value="tipburn">Leaf Tip Burn</option>
    <option value="necrosis">Dead / Necrotic Tissue</option>
</select>

<!-- DAMAGE -->

<label id="damageLabel">⚠️ Disease / Damage Level</label>

<select id="damage">
    <option value="">-- Select Damage Level --</option>
    <option value="verylow">Very Low</option>
    <option value="low">Low</option>
    <option value="medium">Medium</option>
    <option value="high">High</option>
    <option value="severe">Severe</option>
</select>

<button id="predictButton" onclick="predictDisease()">
    🔍 Predict Disease
</button>

<!-- RESULT -->

<div id="result">

    <h2 id="resultTitle">🌿 Prediction Result</h2>

    <div class="result-row">
        <strong id="cropResultLabel">Crop:</strong>
        <span id="cropOutput"></span>
    </div>

    <div class="result-row">
        <strong id="diseaseResultLabel">Predicted Disease:</strong>

    </div>

    <div class="result-row">

    </div>

    <div class="result-row">

    </div>

    </div>

/* =========================================

========================================= */

function changeLanguage() {

    const lang = document.getElementById("language").value;
    const t = text[lang];

    document.getElementById("subtitle").innerText = t.subtitle;
    document.getElementById("formTitle").innerText = t.title;
    document.getElementById("languageLabel").innerText = t.language;

    document.getElementById("symptomLabel").innerText = t.symptom;

    document.getElementById("diseaseResultLabel").innerText = t.diseaseResult;
    document.getElementById("valueResultLabel").innerText = t.valueResult;
    document.getElementById("confidenceResultLabel").innerText = t.confidenceResult;
    document.getElementById("scoreTitle").innerText = t.score;

/* =========================================
   IMAGE PREVIEW
========================================= */

function previewImage() {

    const file = document.getElementById("leafImage").files[0];
    const preview = document.getElementById("preview");

    if (file) {

        const reader = new FileReader();

        reader.onload = function(event) {
            preview.src = event.target.result;
            preview.style.display = "block";
        };

        reader.readAsDataURL(file);
    }
}


/* =========================================
   PREDICTION FUNCTION
========================================= */

function predictDisease() {

    const lang = document.getElementById("language").value;
    const crop = document.getElementById("crop").value;
    const color = document.getElementById("color").value;
    const symptom = document.getElementById("symptom").value;
    const damage = document.getElementById("damage").value;


    /* VALIDATION */

    if (!crop || !color || !symptom || !damage) {
        alert(text[lang].fill);
        return;
    }


    /* -----------------------------------------
       DEFAULT VALUES
    ----------------------------------------- */

    let diseaseKey = "uncertain";

    let cropScore = 0.40;
    let colorScore = 0;
    let symptomScore = 0;
    let damageScore = 0;


    /* =========================================
       1. IDENTIFY DISEASE FROM USER INPUT
    ========================================= */


    /* HEALTHY */

    if (
        symptom === "none" &&
        (
            color === "green" ||
            color === "lightgreen" ||
            color === "darkgreen"
        )
    ) {
        diseaseKey = "healthy";

        cropScore = 0.88;
        colorScore = 0.05;
        symptomScore = 0.04;
    }


    /* CORN */

    else if (crop === "corn") {

        if (symptom === "rust") {

            diseaseKey = "cornRust";
            cropScore = 0.66;
            symptomScore = 0.17;

            if (
                color === "orange" ||
                color === "redbrown" ||
                color === "brown"
            ) {

            }

                colorScore = 0.04;

    /* POTATO */

    /* CHILLI */

        ) {

        cropScore +
        colorScore +
        symptomScore +
        damageScore;

    predictionValue =
        Math.min(predictionValue, 0.99);

        confidence.toFixed(2) + "%";

        confidence + "%";

        cropScore.toFixed(2) +

        colorScore.toFixed(2) +

        "<br>Symptom score = " +
        symptomScore.toFixed(2) +

        "<br>Damage score = " +
        damageScore.toFixed(2) +

        "<br><br><strong>Final = " +
        predictionValue.toFixed(2) +
        "</strong>";

       7. GUIDANCE
    ========================================= */

    if (diseaseKey === "healthy") {

            guidance.healthy[lang];
    }

    else if (diseaseKey === "uncertain") {

            guidance.uncertain[lang];
    }

            guidance.disease[lang];
    }


    /* =========================================
       8. CONFIDENCE STATUS
    ========================================= */

    if (confidence >= 80) {

        document.getElementById("statusOutput").innerText =
            text[lang].high;
    }

    else if (confidence >= 65) {

        document.getElementById("statusOutput").innerText =
            text[lang].medium;
    }

    else {

        document.getElementById("statusOutput").innerText =
            text[lang].low;
    }


    /* =========================================
       9. SHOW RESULT
    ========================================= */

    document.getElementById("result").style.display =
        "block";


    document.getElementById("result").scrollIntoView({
        behavior: "smooth"
    });
}
